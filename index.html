<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>PixelKits v2</title>
  <meta name="description" content="PixelKits - an original retro creature-collecting RPG that runs in your browser.">
  <link rel="stylesheet" href="style.css?v=mumzyrlk">
</head>
<body>
  <div id="game">
    <canvas id="screen" width="240" height="160"></canvas>
    <div id="touchpad">
      <div class="tbtn dpad" id="t-up">&#9650;</div>
      <div class="tbtn dpad" id="t-left">&#9664;</div>
      <div class="tbtn dpad" id="t-right">&#9654;</div>
      <div class="tbtn dpad" id="t-down">&#9660;</div>
      <div class="tbtn round" id="t-b">B</div>
      <div class="tbtn round" id="t-a">A</div>
      <div class="tbtn small" id="t-select">SELECT</div>
      <div class="tbtn small" id="t-start">MENU</div>
    </div>
    <div id="hint">Arrows/WASD: move &middot; Z/Space: A &middot; X/Esc: B (hold to run) &middot; Enter: Menu &middot; Shift: Select</div>
  </div>
  <!-- engine -->
  <script src="src/engine/core.js?v=mumzyrlk"></script>
  <script src="src/engine/input.js?v=mumzyrlk"></script>
  <script src="src/engine/renderer.js?v=mumzyrlk"></script>
  <script src="src/engine/rng.js?v=mumzyrlk"></script>
  <script src="src/engine/font.js?v=mumzyrlk"></script>
  <script src="src/engine/audio.js?v=mumzyrlk"></script>
  <!-- graphics -->
  <script src="src/gfx/color.js?v=mumzyrlk"></script>
  <script src="src/gfx/pixel.js?v=mumzyrlk"></script>
  <script src="src/gfx/tiles.js?v=mumzyrlk"></script>
  <script src="src/gfx/buildings.js?v=mumzyrlk"></script>
  <script src="src/gfx/chars.js?v=mumzyrlk"></script>
  <script src="src/gfx/kitArt.js?v=mumzyrlk"></script>
  <script src="src/gfx/kitDesigns.js?v=mumzyrlk"></script>
  <script src="src/gfx/kitDesigns2.js?v=mumzyrlk"></script>
  <script src="src/gfx/buildings2.js?v=mumzyrlk"></script>
  <script src="src/gfx/props.js?v=mumzyrlk"></script>
  <script src="src/gfx/battleFx.js?v=mumzyrlk"></script>
  <!-- data -->
  <script src="src/data/types.js?v=mumzyrlk"></script>
  <script src="src/data/moves.js?v=mumzyrlk"></script>
  <script src="src/data/kits.js?v=mumzyrlk"></script>
  <script src="src/data/abilities.js?v=mumzyrlk"></script>
  <script src="src/data/items.js?v=mumzyrlk"></script>
  <script src="src/data/trainers.js?v=mumzyrlk"></script>
  <script src="src/data/music.js?v=mumzyrlk"></script>
  <script src="src/data/maps.js?v=mumzyrlk"></script>
  <script src="src/data/story.js?v=mumzyrlk"></script>
  <script src="src/data/v2/brookhollow.js?v=mumzyrlk"></script>
  <script src="src/data/v2/willow.js?v=mumzyrlk"></script>

  <script src="src/data/v2/farpath_rows.js?v=mumzyrlk"></script>
  <script src="src/data/v2/farpath.js?v=mumzyrlk"></script>
  <!-- systems -->
  <script src="src/systems/stats.js?v=mumzyrlk"></script>
  <script src="src/systems/battleEngine.js?v=mumzyrlk"></script>
  <script src="src/systems/game.js?v=mumzyrlk"></script>

  <!-- ui + scenes -->
  <script src="src/ui/ui.js?v=mumzyrlk"></script>

  <script src="src/main.js?v=mumzyrlk"></script>

</html>
